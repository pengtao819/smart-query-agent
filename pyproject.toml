[project]
name = "smart-query-agent"
version = "0.1.0"
description = "智能问数 Agent：自然语言 -> SQL -> 执行 -> 图表 -> 结论"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"